# Пример инвентаря — скопируй в inventory.ini (не коммитится, см. .gitignore
# рядом с deploy/ssh.env) и подставь реальные хосты/пароли или ssh-ключи.
#
# Группа [xray_nodes:vars] — общие для всего парка: адрес control-plane и
# админ-сессия (та же, что заводит deploy/xray/provision-node.sh — см.
# docs/DECISIONS.md, Decision 025, пользователь "Xray Fleet Automation").
# Per-host переменные (label/provider/asn/...) описывают конкретную ноду —
# ровно те же поля, что и флаги provision-node.sh register.

[xray_nodes]
ovh-pl-1     ansible_host=57.128.220.83 ansible_user=ubuntu ansible_password=CHANGE_ME xray_label="Poland OVH Node" xray_provider=OVH xray_asn=16276 xray_country=PL xray_region="Poland" xray_city=Warsaw xray_pool_code=fr-test-1 xray_port=8443 xray_priority=50
contabo-fr-1 ansible_host=167.86.77.100 ansible_user=root   ansible_password=CHANGE_ME xray_label="Contabo France Real Node" xray_provider=Contabo xray_asn=51167 xray_country=FR xray_region="Grand Est" xray_city=Lauterbourg xray_pool_code=fr-contabo-1 xray_port=8446 xray_priority=30

[xray_nodes:vars]
xray_api_base=http://57.128.220.83:8080
xray_admin_session=CHANGE_ME
ansible_python_interpreter=/usr/bin/python3
# Пароли выше — для VPS без ssh-ключа (как в этом проекте, см. deploy/ssh.env).
# Для password-auth нужен sshpass на управляющей машине и:
#   ansible-playbook ... --extra-vars "ansible_ssh_common_args='-o StrictHostKeyChecking=no'"
