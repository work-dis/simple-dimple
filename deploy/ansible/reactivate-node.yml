---
# Ansible equivalent of `deploy/xray/provision-node.sh reactivate`. Flips
# isActive back to true in the control-plane and makes sure the container is
# actually running again (a retired node may have been stopped manually).
#
# Usage:
#   ansible-playbook -i inventory.ini reactivate-node.yml --limit <host> \
#     -e xray_endpoint_id=<endpoint-id> -e xray_pool_code=<pool-code>
- name: Reactivate an Xray node in the control-plane
  hosts: xray_nodes
  become: true
  gather_facts: false
  tasks:
    - name: PATCH endpoint isActive=true
      ansible.builtin.uri:
        url: "{{ xray_api_base }}/api/admin/endpoints/{{ xray_endpoint_id }}"
        method: PATCH
        headers:
          Content-Type: application/json
          x-auth-session-id: "{{ xray_admin_session }}"
        body_format: json
        body:
          isActive: true
        status_code: 200
      delegate_to: localhost
      become: false

    - name: Ensure the Xray container is running
      # docker start is a silent no-op on an already-running container, so
      # there's nothing meaningful to report as changed here either way.
      ansible.builtin.command: docker start "simple-dimple-xray-{{ xray_pool_code }}"
      changed_when: false
