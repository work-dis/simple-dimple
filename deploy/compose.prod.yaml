# Compose-файл целевого сервера (staging/prod).
#
# У проекта сейчас НЕТ GitHub-репозитория (нет `git remote`) — значит
# .github/workflows/ci.yml нигде не выполняется, GHCR-образов не существует.
# Поэтому здесь есть и `build:`, и `image:` одновременно:
#   - `docker compose -f deploy/compose.prod.yaml --env-file .env up --build -d`
#     собирает образы прямо на VPS из скопированных туда исходников (текущий
#     рабочий путь, см. deploy/manual-deploy.sh) и тегирует их как ${..._IMAGE}
#   - если/когда появится GitHub и заработает ci.yml, тот же файл можно будет
#     использовать без --build: он просто `pull`-нет уже собранные и
#     запушенные в GHCR образы под теми же именами
#
# Postgres: для однохостового staging/ручного теста поднимается прямо здесь
# (тот же способ, что в корневом compose.yaml). Для настоящего prod с managed
# БД — удали сервис postgres и depends_on ниже, а DATABASE_URL в .env направь
# на внешний инстанс.
#
# `migrate` — одноразовый сервис (profile "tools", сам никогда не стартует
# при обычном `up`). Собран из стадии `build` backend/Dockerfile — только там
# есть backend/prisma/*, backend/prisma.config.ts и prisma CLI (в runtime-стадии
# их нет, см. backend/Dockerfile). Прогонять перед первым `up`:
#   docker compose -f deploy/compose.prod.yaml --env-file .env --profile tools \
#     run --rm migrate
#
# TLS (Decision 039, DECISIONS.md): единственный сервис с портами наружу —
# `caddy`, он единственный, кто слушает :80/:443 на хосте. `frontend` и
# `backend` доступны только внутри docker-сети — caddy сам получает и
# продлевает сертификат Let's Encrypt (ACME) по домену `CONTROL_PLANE_DOMAIN`
# из .env и проксирует на frontend:80 (тот, в свою очередь, проксирует
# /api на backend:8080, см. deploy/nginx/frontend.conf). До этого пароли,
# OTP-коды и x-auth-session-id ходили голым HTTP до самого пользователя.
# `CONTROL_PLANE_DOMAIN` должен A-записью указывать на IP VPS ДО первого
# `up` — иначе ACME HTTP-01 challenge не пройдёт и caddy не поднимется.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simple_dimple}
      POSTGRES_USER: ${POSTGRES_USER:-simpledimple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simpledimple} -d ${POSTGRES_DB:-simple_dimple}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: build
    image: ${BACKEND_IMAGE:-simple-dimple-backend}-build
    profiles: ["tools"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["npx", "prisma", "migrate", "deploy", "--config", "backend/prisma.config.ts"]

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${BACKEND_IMAGE:-simple-dimple-backend:local}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # Без ports наружу — только внутри docker-сети (frontend проксирует
    # /api на backend:8080, см. deploy/nginx/frontend.conf). Раньше здесь
    # был "8080:8080", то есть голый HTTP control-plane был доступен в обход
    # TLS-терминатора caddy — закрыто Decision 039 (DECISIONS.md).

  route-reprobe-worker:
    image: ${BACKEND_IMAGE:-simple-dimple-backend:local}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["node", "backend/dist/worker.js"]

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: ${FRONTEND_IMAGE:-simple-dimple-frontend:local}
    restart: unless-stopped
    depends_on:
      - backend
    # Без ports наружу — caddy (ниже) единственный контейнер, слушающий
    # хост-порты; frontend доступен ему по имени сервиса в docker-сети.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
