# nginx-конфиг для контейнера frontend (Шаг 4, PRIORITY_PLAN.md).
# `backend` — имя сервиса backend в той же compose-сети (см. compose.yaml,
# profile "prod"); при деплое вне compose поменяйте на реальный host:port.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8080;
    }

    # SPA fallback — PWA-роутинг живёт на клиенте (frontend/src/App.tsx,
    # screen state), любой не-статический путь отдаём как index.html.
    location / {
        try_files $uri /index.html;
    }
}
