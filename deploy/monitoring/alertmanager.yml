route:
  receiver: telegram
  group_by: [alertname, instance, pool, probe_site]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ''
        message: |-
          {{ if eq .Status "resolved" }}✅ Восстановлено{{ else }}⚠️ {{ .CommonLabels.severity }}{{ end }}
          {{ range .Alerts -}}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
